<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes Dépenses</title>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a7d3b">
<style>
  * { box-sizing: border-box; margin: 0; font-family: sans-serif; }
  body { background: #f2f4f3; padding-bottom: 24px; }
  header { background: #0a7d3b; color: #fff; padding: 20px 16px; text-align: center; }
  header small { opacity: .85; }
  #total { font-size: 32px; font-weight: bold; margin-top: 4px; }
  .form { padding: 16px; display: grid; gap: 8px; }
  input, select { padding: 14px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; background: #fff; }
  button.add { padding: 14px; background: #0a7d3b; color: #fff; border: 0; border-radius: 8px; font-size: 16px; }
  #resume { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 8px; }
  .chip { background: #fff; border-radius: 20px; padding: 8px 12px; font-size: 13px; border: 1px solid #dde; }
  .chip b { color: #0a7d3b; }
  .filtre { padding: 0 16px 8px; }
  .filtre select { width: 100%; }
  ul { list-style: none; padding: 0 16px; }
  li { background: #fff; padding: 12px; margin-bottom: 8px; border-radius: 8px;
       display: flex; justify-content: space-between; align-items: center; }
  li span small { display: block; color: #888; font-size: 12px; }
  .tag { display: inline-block; background: #e3f4ea; color: #0a7d3b; border-radius: 10px;
         padding: 2px 8px; font-size: 11px; margin-top: 4px; }
  .montant { font-weight: bold; margin-right: 10px; }
  .sup { background: none; border: 0; color: #c0392b; font-size: 20px; }
  .vide { text-align: center; color: #888; padding: 20px; }
</style>
</head>
<body>
  <header>
    <small>Total des dépenses</small>
    <div id="total">0 FCFA</div>
  </header>

  <div class="form">
    <input id="desc" placeholder="Description (ex: Taxi)">
    <input id="montant" type="number" inputmode="numeric" placeholder="Montant en FCFA">
    <select id="cat"></select>
    <button class="add" id="ajout">Ajouter la dépense</button>
  </div>

  <div id="resume"></div>

  <div class="filtre">
    <select id="filtre"></select>
  </div>

  <ul id="liste"></ul>

<script>
  const CATEGORIES = ['Transport', 'Nourriture', 'Factures', 'Santé', 'Loisirs', 'Autre'];
  let depenses = JSON.parse(localStorage.getItem('depenses') || '[]');
  depenses.forEach(d => { if (!d.cat) d.cat = 'Autre'; });

  const $ = id => document.getElementById(id);
  const liste = $('liste'), totalEl = $('total'), resume = $('resume');
  const desc = $('desc'), montant = $('montant'), cat = $('cat'), filtre = $('filtre');

  cat.innerHTML = CATEGORIES.map(c => `<option>${c}</option>`).join('');
  filtre.innerHTML = '<option value="">Toutes les catégories</option>' +
    CATEGORIES.map(c => `<option>${c}</option>`).join('');

  const fcfa = n => n.toLocaleString('fr-FR') + ' FCFA';
  const sauver = () => localStorage.setItem('depenses', JSON.stringify(depenses));

  function afficher() {
    totalEl.textContent = fcfa(depenses.reduce((s, d) => s + d.montant, 0));

    // Total par catégorie
    const parCat = {};
    depenses.forEach(d => parCat[d.cat] = (parCat[d.cat] || 0) + d.montant);
    resume.innerHTML = Object.keys(parCat)
      .map(c => `<div class="chip">${c} : <b>${fcfa(parCat[c])}</b></div>`).join('');

    // Liste filtrée
    const f = filtre.value;
    const lignes = depenses
      .map((d, i) => ({ d, i }))
      .filter(x => !f || x.d.cat === f)
      .reverse();

    if (lignes.length === 0) {
      liste.innerHTML = '<div class="vide">Aucune dépense</div>';
      return;
    }

    liste.innerHTML = lignes.map(({ d, i }) => `
      <li>
        <span>${d.desc}<small>${d.date}</small><span class="tag">${d.cat}</span></span>
        <div>
          <span class="montant">${fcfa(d.montant)}</span>
          <button class="sup" onclick="supprimer(${i})">✕</button>
        </div>
      </li>`).join('');
  }

  function supprimer(i) {
    depenses.splice(i, 1);
    sauver();
    afficher();
  }

  $('ajout').onclick = () => {
    const d = desc.value.trim();
    const m = parseInt(montant.value, 10);
    if (!d || !m || m <= 0) {
      alert('Saisissez une description et un montant valide.');
      return;
    }
    depenses.push({
      desc: d.replace(/</g, '&lt;'),
      montant: m,
      cat: cat.value,
      date: new Date().toLocaleDateString('fr-FR')
    });
    sauver();
    desc.value = '';
    montant.value = '';
    afficher();
  };

  filtre.onchange = afficher;
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  afficher();
</script>
</body>
    </html>
